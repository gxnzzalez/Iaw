<VirtualHost *:80>
    ServerName nimbusguantes.com
    ServerAlias www.nimbusguantes.com
    DocumentRoot /var/www/html/guantes

    <Directory /var/www/html/guantes>
        Options -Indexes
        Require all granted
    </Directory>

    <Files "Archivos_privados.conf">
        Require all denied
    </Files>

    DirectoryIndex index.html

    ErrorLog ${APACHE_LOG_DIR}/nimbusguantes_error.log
    CustomLog ${APACHE_LOG_DIR}/nimbusguantes_access.log combined
</VirtualHost>