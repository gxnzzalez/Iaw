<VirtualHost *:8080>
    ServerName pordefecto.com
    ServerAlias www.pordefecto.com
    DocumentRoot /var/www/html/virtualhost

    <Directory /var/www/html/virtualhost>
        AllowOverride None
        Require all denied
    </Directory>

    DirectoryIndex index.html

    ErrorLog ${APACHE_LOG_DIR}/catchall_error.log
    CustomLog ${APACHE_LOG_DIR}/catchall_access.log combined
</VirtualHost>