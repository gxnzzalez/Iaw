<VirtualHost *:8080>
    ServerName nimbusbotas.com
    ServerAlias www.nimbusbotas.com
    DocumentRoot /var/www/html/botas

    <Directory /var/www/html/botas>
        Options -Indexes
        Require all granted
    </Directory>

    DirectoryIndex index.html

    ErrorLog ${APACHE_LOG_DIR}/nimbusbotas_error.log
    CustomLog ${APACHE_LOG_DIR}/nimbusbotas_access.log combined
</VirtualHost>
