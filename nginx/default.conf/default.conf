# Redirección global de HTTP a HTTPS
server {
    listen 80;
    server_name nimbusbotas.com www.nimbusbotas.com nimbusguantes.com www.nimbusguantes.com;

    return 301 https://$host$request_uri;
}

# Servidor HTTPS con Reverse Proxy, cabeceras de seguridad y Rate Limit
server {
    listen 443 ssl;
    server_name nimbusbotas.com www.nimbusbotas.com nimbusguantes.com www.nimbusguantes.com;

    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cabeceras de Seguridad obligatorias
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        # Aplicación del Rate Limit con ráfaga de 5 peticiones
        limit_req zone=doc_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
