services:
  Apache:
    image: ubuntu/apache2:latest
    container_name: nimbus_doc
    
    ports:
      - "2007:8080"
    volumes:
      - ./html:/var/www/html
      - ./configuracion.virtualhost:/etc/apache2/sites-available/
      - ./configuracion.virtualhost/ports.conf:/etc/apache2/ports.conf:ro
    restart: unless-stopped

  proxy-nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "1975:80"
      - "1960:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nimbus.conf:/etc/nginx/conf.d/nimbus.conf:ro
      - ./nginx/certs/server.crt:/etc/ssl/certs/server.crt:ro
      - ./nginx/certs/server.key:/etc/ssl/private/server.key:ro
    depends_on:
      - Apache
    
